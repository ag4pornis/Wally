services:
  wally:
    build: .
    image: wally:latest
    container_name: wally
    restart: unless-stopped
    working_dir: /app
    environment:
      - WALLY_DATA=/data
    volumes:
      # Una SOLA carpeta con secrets.json, busquedas.json y vistos.db.
      # Así el guardado atómico del panel (os.replace) funciona y SQLite crea
      # vistos.db por sí mismo (no hace falta crearlo a mano).
      - /DATA/AppData/wally:/data
