services:
  wally:
    build: .
    image: wally:latest
    container_name: wally
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /DATA/AppData/wally/secrets.json:/app/secrets.json:ro
      - /DATA/AppData/wally/busquedas.json:/app/busquedas.json
      - /DATA/AppData/wally/vistos.db:/app/vistos.db
